name: landing-build
on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "Dockerfile.landing"
      - ".github/workflows/landing-build.yml"
  pull_request:
    paths:
      - "apps/landing/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: https://info-aggregator-reseller.prin7r.com
